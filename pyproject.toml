[project]
name = "olxcars"
version = "0.1.0"
description = "OLX India used-car search: CLI + MCP server for AI agents"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "mcp>=1.0",
]

[project.scripts]
olxcars = "olxcars.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["olxcars*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
